name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[test,analysis]"
      - name: Run unit tests without integration folder
        run: python -m pytest tests --ignore=tests/integration -q -o addopts=''

  integration-local:
    name: Local integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[test,analysis]"
      - name: Run mocked/local integration tests
        run: python -m pytest tests/integration -q -o addopts=''

  sync-drift-regressions:
    name: Sync drift regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run sync drift fixtures
        run: python -m pytest tests/test_sync_drift_regressions.py tests/test_sync_planner.py -q -o addopts=''

  coverage:
    name: Full coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[test,analysis]"
      - name: Run full suite with coverage
        run: python -m pytest
