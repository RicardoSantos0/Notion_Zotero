# Title-Based Prediction-Horizon Overrides — LA Student Success Review
#
# Schema version: 1.1
# These overrides were extracted from the hard-coded REVIEWED_HORIZON_TITLE_PATTERNS
# dict that previously lived in pred_horizon_summary.py.
#
# Each entry maps a partial title regex pattern to a manually reviewed horizon
# classification.  Patterns are matched case-insensitively against the combined
# source_title / Paper title / title / Study fields of a PRED row.
#
# Schema:
#   pattern         : str   — Python regex fragment (applied with re.search, IGNORECASE)
#   horizon         : str   — "Long-term" | "Short-term"
#   rationale       : str   — required; why this paper was manually reviewed and override set
#   reviewer        : str   — reviewer name or initials
#   date            : str   — ISO 8601 date
#
# Processing:
#   classify_horizons_with_source() in pred_horizon_summary.py loads this file
#   (when the overrides loader is active) and checks title patterns BEFORE the
#   automated alias rules.  Title overrides take full precedence over the alias
#   classifier for the papers they match.
#
# How to add a new override:
#   1. Run the unclassified-rows report:
#         notion-zotero la-review unclassified --input <canonical_dir>
#   2. For each paper needing a manual horizon decision, add an entry here with a
#      distinctive but minimal regex pattern from the title.
#   3. Record the rationale (why the automated classifier failed / what was ambiguous).
#   4. Commit with a message referencing taxonomy_version_stamp 1.1.
#
# See also:
#   manual_overrides.yaml   — field-level dimension overrides (target_construct, etc.)
#   taxonomy_notes.md       — commentary on systematic ambiguity patterns
#   src/notion_zotero/analysis/pred_horizon_summary.py::classify_horizons_with_source()

taxonomy_version_stamp: "1.1"
review_id: la_student_success_review
maintainer: Ricardo Santos
last_updated: "2026-06-07"

title_overrides:

  # --- Long-term horizon overrides ----------------------------------------
  # These papers predict program-level outcomes (graduation, retention, degree
  # completion) even though their titles or extracted text may also contain
  # course-level vocabulary.

  - pattern: "multi-model heterogeneous ensemble"
    horizon: "Long-term"
    rationale: >
      Ensemble approach targeting multi-year student degree completion; program-level
      retention outcome confirmed from methods.  Automated classifier fires Short-term
      due to course-related vocabulary in the extracted target text.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "improved multi-view hypergraph"
    horizon: "Long-term"
    rationale: >
      Multi-view graph model predicts graduation/dropout at program level.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "high-stakes examinations"
    horizon: "Long-term"
    rationale: >
      High-stakes national examinations are program-level milestones in the HEI context.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "early segmentation of students according to their academic performance"
    horizon: "Long-term"
    rationale: >
      Academic performance segmentation is used as a proxy for program-level dropout
      risk; confirmed from abstract and methodology.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "university student retention"
    horizon: "Long-term"
    rationale: >
      Explicit program-level retention prediction at a university; keyword "retention"
      should suffice but paper also contains "course" in the extracted fields.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "university student dropout.*preference"
    horizon: "Long-term"
    rationale: >
      Program-level dropout prediction incorporating student preference data.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "mooc learner behavior prediction"
    horizon: "Long-term"
    rationale: >
      Although MOOC context, the study predicts long-term learner engagement patterns
      across multiple course offerings (not a single-course completion task).
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "master of data science program using admissions data"
    horizon: "Long-term"
    rationale: >
      Prediction from admissions data for a master's program = program-level,
      before_program_or_at_admission timing.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "student achievement prediction using deep neural network from multi-source campus data"
    horizon: "Long-term"
    rationale: >
      Multi-source campus data (library, canteen, dormitory) => program-level behavioral
      outcome prediction.  Short-term alias fires on "achievement prediction".
    reviewer: "RS"
    date: "2026-06-07"

  # --- Short-term horizon overrides ---------------------------------------
  # These papers predict course-level outcomes even though their titles or extracted
  # text may contain program-level vocabulary (e.g. "university", "program").

  - pattern: "academic performance of students with machine learning"
    horizon: "Short-term"
    rationale: >
      Generic title; methods confirm single-course final grade prediction, not
      program-level outcome.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "time series interaction analysis"
    horizon: "Short-term"
    rationale: >
      Session-level interaction sequences within a course; outcome is course-level.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "subscription-based online learning"
    horizon: "Short-term"
    rationale: >
      Subscription platform (e.g. Duolingo-style); predicts per-course or per-lesson
      dropout, not degree-level dropout.  Long-term alias fires on "retention" in the
      extracted text.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "deeplms"
    horizon: "Short-term"
    rationale: >
      LMS-based course-level next-week performance prediction.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "formative assessment.*learning outcomes"
    horizon: "Short-term"
    rationale: >
      Formative assessment scores predict end-of-course learning outcomes.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "multimodal predictive student modeling"
    horizon: "Short-term"
    rationale: >
      Multimodal features (eye tracking, keystrokes) to predict within-session or
      within-course performance.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "learning analytics should not promote one size fits all"
    horizon: "Short-term"
    rationale: >
      Critical/discussion paper centered on course-level LA dashboards.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "estimate overall scores in tertiary preparatory general science"
    horizon: "Short-term"
    rationale: >
      Predicts final course score in a tertiary preparatory (bridging) course.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "goal-based course recommendation"
    horizon: "Short-term"
    rationale: >
      Next-course recommendation based on student goals; outcome is course-level
      enrollment/completion, not program-level graduation.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "distance higher education using semi-supervised"
    horizon: "Short-term"
    rationale: >
      Semi-supervised prediction of student performance in a distance HEI course.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "ou analyse"
    horizon: "Short-term"
    rationale: >
      Open University (OU) MOOC analysis; course-level pass/fail prediction.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "supervised learning framework.*dropping out.*mooc"
    horizon: "Short-term"
    rationale: >
      Explicit MOOC context => dropout is course-level (MOOC dropout disambiguation rule).
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "identifying at-risk students for early intervention"
    horizon: "Short-term"
    rationale: >
      At-risk identification for early course intervention; course-level framing
      confirmed from methods.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "time-on-task estimation"
    horizon: "Short-term"
    rationale: >
      Session/activity-level time-on-task; outcome is within-course.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "evaluation of early student performance prediction"
    horizon: "Short-term"
    rationale: >
      Evaluation study of early prediction within a course; course-level outcome.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "automl in educational data mining"
    horizon: "Short-term"
    rationale: >
      AutoML benchmark study on course-level performance prediction datasets.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "small cohorts with minimal available attributes"
    horizon: "Short-term"
    rationale: >
      Small-cohort study predicting course outcomes with limited features.
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "delving deeper into mooc student dropout"
    horizon: "Short-term"
    rationale: >
      Explicit MOOC context => course-level dropout (disambiguation rule).
    reviewer: "RS"
    date: "2026-06-07"

  - pattern: "enhancing educational evaluation"
    horizon: "Short-term"
    rationale: >
      Educational evaluation study focused on course-level assessment outcomes.
    reviewer: "RS"
    date: "2026-06-07"
