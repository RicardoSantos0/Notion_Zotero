  #    Human reviewer should read the methods section to determine which frame the
  #    authors use: is the positive outcome "promoted" (completion frame) or is
  #    "dropout" the primary outcome variable (withdrawal frame)?
  #    PROPOSED: completion_or_certification if the study frames program progression
  #    (Dropout=0 / Promoted=1 is the positive class), else dropout_or_withdrawal.
  #    NOT self-promoted — requires human adjudication.
