# Manual Overrides — LA Student Success Review
#
# Schema version: 1.1
# taxonomy_version_stamp must match the `version` field in learning_analytics_taxonomy.yaml.
# All entries require a `rationale` field documenting the human reviewer's reasoning.
#
# Header fields (required):
#   taxonomy_version_stamp  — must match taxonomy YAML version (d-013 constraint)
#   review_id               — identifier of the systematic review this file governs
#   maintainer              — reviewer responsible for this file
#   last_updated            — ISO 8601 date of last change
#
# Override entry schema:
#   contribution_id   : str   — stable identifier (from pred_contribution_rows.csv)
#   paper_id          : str   — Notion page_id of the parent paper
#   field             : str   — taxonomy dimension being overridden
#   value             : str   — corrected vocabulary label (must be in taxonomy vocabulary)
#   rationale         : str   — required; human reviewer explanation
#   reviewer          : str   — reviewer name or initials
#   date              : str   — ISO 8601 date of override decision
#   supersedes        : str?  — optional; automated-classifier label being replaced
#
# Workflow:
#   1. Run the automated classifier to produce taxonomy_audit.csv
#   2. Review low-confidence and conflict rows in taxonomy_audit.csv
#   3. Add adjudicated corrections here with full rationale
#   4. Re-run the pipeline; apply_overrides() applies these after classification
#   5. Override application is logged in the audit output (see overrides_applied column)
#
# See also:
#   title_overrides.yaml  — paper-level prediction horizon / title-fragment overrides
#   taxonomy_notes.md     — human-readable commentary on edge cases
#   src/notion_zotero/analysis/pred_horizon_summary.py::apply_overrides()

taxonomy_version_stamp: "1.1"
review_id: la_student_success_review
